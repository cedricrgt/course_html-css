<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Tutoriels HTML / CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    :root {
      --bg: #ffffff;
      --bg2: #f5f5f3;
      --bg3: #eeede9;
      --text: #1a1a1a;
      --text2: #555;
      --text3: #888;
      --border: rgba(0,0,0,0.12);
      --border2: rgba(0,0,0,0.22);
      --purple: #7F77DD;
      --purple-dark: #534AB7;
      --purple-light: #EEEDFE;
      --purple-text: #3C3489;
      --radius: 8px;
      --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg2: #2c2c2e;
        --bg3: #3a3a3c;
        --text: #f2f2f7;
        --text2: #aeaeb2;
        --text3: #636366;
        --border: rgba(255,255,255,0.1);
        --border2: rgba(255,255,255,0.2);
        --purple-light: #26215C;
        --purple-text: #AFA9EC;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }

    /* TOPBAR */
    #topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      padding: .75rem 1rem;
      background: var(--bg);
      border-bottom: 0.5px solid var(--border);
    }
    #menu-btn {
      background: none; border: 0.5px solid var(--border2);
      border-radius: var(--radius); padding: 7px 9px;
      cursor: pointer; color: var(--text2); font-size: 18px; line-height: 1; flex-shrink: 0;
    }
    #menu-btn:active { background: var(--bg2); }
    #topbar-info { flex: 1; min-width: 0; }
    #lesson-title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #lesson-meta { font-size: 11px; color: var(--text3); }
    #counter {
      font-size: 11px; color: var(--text3); flex-shrink: 0;
      background: var(--bg2); padding: 3px 8px;
      border-radius: 20px; border: 0.5px solid var(--border);
    }

    /* DRAWER */
    #drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 20; }
    #drawer-overlay.open { display: block; }
    #drawer {
      position: fixed; top: 0; left: -290px; width: 280px; height: 100%;
      background: var(--bg); border-right: 0.5px solid var(--border);
      overflow-y: auto; z-index: 30; transition: left .22s ease;
    }
    #drawer.open { left: 0; }
    #drawer-head {
      padding: .9rem 1rem; border-bottom: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: var(--bg); z-index: 1;
    }
    #drawer-head span { font-size: 12px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
    #close-drawer { background: none; border: none; font-size: 20px; color: var(--text2); cursor: pointer; padding: 4px; }
    .part-label { padding: .5rem 1rem; font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; background: var(--bg2); }
    .l-btn {
      display: block; width: 100%; text-align: left;
      padding: .6rem 1rem .6rem 1.25rem; font-size: 13px;
      color: var(--text2); background: none; border: none;
      border-left: 2px solid transparent; cursor: pointer; line-height: 1.4;
    }
    .l-btn.active { color: var(--text); font-weight: 500; border-left-color: var(--purple); background: var(--bg2); }
    .l-btn:active { background: var(--bg2); }

    /* CONTENT */
    #content { padding: 1rem; max-width: 700px; margin: 0 auto; }
    .sec-label {
      font-size: 11px; font-weight: 500; letter-spacing: .07em;
      text-transform: uppercase; color: var(--text3);
      margin-bottom: .5rem; display: flex; align-items: center; gap: 5px;
    }
    .prep-box {
      font-size: 13px; color: var(--text2); background: var(--bg2);
      border-radius: var(--radius); padding: .65rem .85rem;
      margin-bottom: .85rem; line-height: 1.55;
      display: flex; gap: 8px; align-items: flex-start;
      border: 0.5px solid var(--border);
    }
    .prep-box i { font-size: 15px; flex-shrink: 0; margin-top: 1px; color: var(--purple); }
    .script-box {
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1rem 1.1rem; margin-bottom: .85rem;
    }
    .script-box p { font-size: 14px; color: var(--text); line-height: 1.78; margin-bottom: .65rem; }
    .script-box p:last-child { margin-bottom: 0; }
    .hl {
      background: var(--purple-light); color: var(--purple-text);
      padding: 1px 5px; border-radius: 3px;
      font-family: 'Courier New', monospace; font-size: 12px;
    }
    .tip-box {
      border-left: 3px solid var(--purple); border-radius: 0 var(--radius) var(--radius) 0;
      background: var(--bg2); padding: .65rem .9rem;
      margin-bottom: .85rem; font-size: 13px; color: var(--text2); line-height: 1.55;
    }
    .code-wrap { border-radius: var(--radius-lg); overflow: hidden; border: 0.5px solid #313145; margin-bottom: .85rem; }
    .code-hdr { display: flex; align-items: center; justify-content: space-between; padding: .5rem .9rem; background: #16162a; }
    .code-lang { font-size: 11px; font-weight: 500; color: var(--purple); letter-spacing: .05em; text-transform: uppercase; }
    .copy-btn {
      font-size: 11px; color: #888; background: none;
      border: 0.5px solid #555; border-radius: 4px;
      padding: 4px 10px; cursor: pointer; font-family: inherit;
      transition: color .15s, border-color .15s;
    }
    .copy-btn:hover { color: #ccc; border-color: #888; }
    .copy-btn.ok { color: #5DCAA5; border-color: #5DCAA5; }
    pre {
      background: #1e1e2e; padding: .9rem 1rem;
      overflow-x: auto; font-size: 13px; line-height: 1.65;
      color: #cdd6f4; font-family: 'Courier New', monospace;
      -webkit-overflow-scrolling: touch;
    }
    .kw { color: #cba6f7; } .tag { color: #89b4fa; } .attr { color: #a6e3a1; }
    .str { color: #f9e2af; } .cm { color: #6c7086; font-style: italic; }
    .sel { color: #89dceb; } .prop { color: #cba6f7; } .val { color: #f9e2af; } .num { color: #fab387; }

    /* NAV BUTTONS */
    .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: .25rem; padding-bottom: 2rem; }
    .nav-btn {
      padding: .7rem; font-size: 13px; background: var(--bg);
      border: 0.5px solid var(--border2); border-radius: var(--radius);
      cursor: pointer; color: var(--text2); font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: background .15s;
    }
    .nav-btn:hover { background: var(--bg2); color: var(--text); }
    .nav-btn:active { background: var(--bg3); }
    .nav-btn:disabled { opacity: .3; cursor: not-allowed; }
  </style>
</head>

<h2 class="sr-only">Script interactif pour mini-tutoriels HTML/CSS — naviguez par partie et leçon pour lire le script et copier les extraits de code.</h2>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header"><h1><i class="ti ti-video" aria-hidden="true"></i> Script Vidéo</h1></div>
    <div id="nav-tree"></div>
  </div>
  <div id="main">
    <div id="topbar">
      <span id="lesson-title">Sélectionnez une leçon</span>
      <span id="lesson-meta"></span>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
const lessons = [
  {part:"Partie 1 — Bases HTML5",lessons:[
    {title:"Créez votre première page HTML",meta:"~3 min",
     intro:"Ouvrir l'éditeur de code (VS Code recommandé) et créer un fichier index.html.",
     script:[
       "Bienvenue dans ce premier tutoriel ! Aujourd'hui, on va créer ensemble notre toute première page web en HTML.",
       "HTML, c'est le squelette de chaque page web que vous visitez. Chaque navigateur sait lire ce langage et l'afficher à l'écran.",
       "Tout fichier HTML commence par une déclaration de type de document : <span class='highlight'>&lt;!DOCTYPE html&gt;</span>. Ça indique au navigateur qu'il s'agit bien d'un document HTML5.",
       "Ensuite, on ouvre la balise racine <span class='highlight'>&lt;html&gt;</span>, puis le <span class='highlight'>&lt;head&gt;</span> pour les métadonnées, et le <span class='highlight'>&lt;body&gt;</span> pour tout ce qui sera visible. Je vous recopie le squelette complet ci-dessous."
     ],
     tip:"💡 Conseil à dire à l'écran : « Recopiez ce squelette par cœur — vous l'utiliserez dans chaque projet ! »",
     code:{lang:"html",code:`<span class="cm">&lt;!-- Structure de base HTML5 --&gt;</span>
<span class="kw">&lt;!DOCTYPE html&gt;</span>
<span class="tag">&lt;html</span> <span class="attr">lang</span>=<span class="str">"fr"</span><span class="tag">&gt;</span>
<span class="tag">&lt;head&gt;</span>
  <span class="tag">&lt;meta</span> <span class="attr">charset</span>=<span class="str">"UTF-8"</span><span class="tag">&gt;</span>
  <span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="str">"viewport"</span> <span class="attr">content</span>=<span class="str">"width=device-width"</span><span class="tag">&gt;</span>
  <span class="tag">&lt;title&gt;</span>Ma première page<span class="tag">&lt;/title&gt;</span>
<span class="tag">&lt;/head&gt;</span>
<span class="tag">&lt;body&gt;</span>
  <span class="tag">&lt;h1&gt;</span>Bonjour le monde !<span class="tag">&lt;/h1&gt;</span>
  <span class="tag">&lt;p&gt;</span>Ma toute première page web.<span class="tag">&lt;/p&gt;</span>
<span class="tag">&lt;/body&gt;</span>
<span class="tag">&lt;/html&gt;</span>`}},

    {title:"Différence entre HTML et CSS",meta:"~2 min",
     intro:"Montrer un exemple concret côte à côte : HTML seul, puis avec CSS.",
     script:[
       "Une question revient souvent chez les débutants : quelle est la différence entre HTML et CSS ?",
       "HTML, c'est la structure. C'est comme la charpente d'une maison : les murs, les portes, les fenêtres. On définit CE QU'IL Y A sur la page.",
       "CSS, c'est la décoration. C'est la peinture, le mobilier, les rideaux. On définit COMMENT ça s'affiche : les couleurs, les tailles, les positions.",
       "Regardez ce code : à gauche, le HTML brut. À droite, le même HTML auquel on a lié un fichier CSS. Même contenu, apparence radicalement différente."
     ],
     tip:"💡 Astuce de tournage : affichez les deux fichiers en split-screen dans votre éditeur.",
     code:{lang:"html",code:`<span class="cm">&lt;!-- HTML : la STRUCTURE --&gt;</span>
<span class="tag">&lt;h1&gt;</span>Mon titre<span class="tag">&lt;/h1&gt;</span>
<span class="tag">&lt;p&gt;</span>Mon paragraphe.<span class="tag">&lt;/p&gt;</span>
<span class="tag">&lt;button&gt;</span>Cliquez ici<span class="tag">&lt;/button&gt;</span>

<span class="cm">&lt;!-- CSS : la MISE EN FORME (dans style.css) --&gt;</span>
<span class="sel">h1</span> {
  <span class="prop">color</span>: <span class="val">#7F77DD</span>;
  <span class="prop">font-size</span>: <span class="val">2rem</span>;
}
<span class="sel">button</span> {
  <span class="prop">background</span>: <span class="val">#7F77DD</span>;
  <span class="prop">color</span>: <span class="val">white</span>;
  <span class="prop">padding</span>: <span class="val">8px 16px</span>;
  <span class="prop">border-radius</span>: <span class="val">6px</span>;
}`}},

    {title:"Organiser le texte : titres et paragraphes",meta:"~3 min",
     intro:"Ouvrir index.html et taper le code en direct.",
     script:[
       "Pour organiser le texte d'une page, HTML nous offre six niveaux de titres : de h1 à h6. H1 est le plus important, h6 le moins important.",
       "La règle d'or : une seule balise <span class='highlight'>&lt;h1&gt;</span> par page ! C'est crucial pour le référencement Google et l'accessibilité.",
       "Les paragraphes se balises avec <span class='highlight'>&lt;p&gt;</span>. Chaque paragraphe est séparé automatiquement par de l'espace.",
       "Pour les listes, on a <span class='highlight'>&lt;ul&gt;</span> pour les listes à puces, et <span class='highlight'>&lt;ol&gt;</span> pour les listes numérotées. Dans les deux cas, chaque élément s'entoure de la balise <span class='highlight'>&lt;li&gt;</span>."
     ],
     tip:"💡 À dire : « Tapez ce code avec moi, lettre par lettre — c'est comme ça qu'on mémorise ! »",
     code:{lang:"html",code:`<span class="cm">&lt;!-- Les 6 niveaux de titres --&gt;</span>
<span class="tag">&lt;h1&gt;</span>Titre principal (unique !)<span class="tag">&lt;/h1&gt;</span>
<span class="tag">&lt;h2&gt;</span>Sous-section<span class="tag">&lt;/h2&gt;</span>
<span class="tag">&lt;h3&gt;</span>Sous-sous-section<span class="tag">&lt;/h3&gt;</span>

<span class="cm">&lt;!-- Paragraphes --&gt;</span>
<span class="tag">&lt;p&gt;</span>Un paragraphe de texte normal.<span class="tag">&lt;/p&gt;</span>

<span class="cm">&lt;!-- Liste à puces --&gt;</span>
<span class="tag">&lt;ul&gt;</span>
  <span class="tag">&lt;li&gt;</span>Pommes<span class="tag">&lt;/li&gt;</span>
  <span class="tag">&lt;li&gt;</span>Bananes<span class="tag">&lt;/li&gt;</span>
<span class="tag">&lt;/ul&gt;</span>

<span class="cm">&lt;!-- Liste numérotée --&gt;</span>
<span class="tag">&lt;ol&gt;</span>
  <span class="tag">&lt;li&gt;</span>Première étape<span class="tag">&lt;/li&gt;</span>
  <span class="tag">&lt;li&gt;</span>Deuxième étape<span class="tag">&lt;/li&gt;</span>
<span class="tag">&lt;/ol&gt;</span>`}},

    {title:"Liens hypertextes et images",meta:"~3 min",
     intro:"Montrer comment créer des liens internes et externes, puis insérer une image.",
     script:[
       "Les liens, c'est l'ADN du web ! La balise <span class='highlight'>&lt;a&gt;</span>, pour 'anchor', permet de naviguer d'une page à l'autre.",
       "L'attribut <span class='highlight'>href</span> contient la destination. Pour un lien externe, on met l'URL complète avec https://. Pour un lien interne, on met juste le nom du fichier.",
       "L'attribut <span class='highlight'>target=\"_blank\"</span> ouvre le lien dans un nouvel onglet. Utile pour les liens vers des sites externes !",
       "Pour les images, on utilise <span class='highlight'>&lt;img&gt;</span>. C'est une balise auto-fermante — pas de balise fermante séparée. L'attribut <span class='highlight'>alt</span> est obligatoire : il décrit l'image pour les personnes malvoyantes et les moteurs de recherche."
     ],
     tip:"💡 Bonnes pratiques à rappeler : toujours renseigner l'attribut alt sur les images !",
     code:{lang:"html",code:`<span class="cm">&lt;!-- Lien externe --&gt;</span>
<span class="tag">&lt;a</span> <span class="attr">href</span>=<span class="str">"https://www.google.fr"</span>
   <span class="attr">target</span>=<span class="str">"_blank"</span><span class="tag">&gt;</span>
  Visiter Google
<span class="tag">&lt;/a&gt;</span>

<span class="cm">&lt;!-- Lien interne (même dossier) --&gt;</span>
<span class="tag">&lt;a</span> <span class="attr">href</span>=<span class="str">"contact.html"</span><span class="tag">&gt;</span>
  Nous contacter
<span class="tag">&lt;/a&gt;</span>

<span class="cm">&lt;!-- Image avec texte alternatif --&gt;</span>
<span class="tag">&lt;img</span>
  <span class="attr">src</span>=<span class="str">"images/photo.jpg"</span>
  <span class="attr">alt</span>=<span class="str">"Paysage de montagne au coucher du soleil"</span>
  <span class="attr">width</span>=<span class="str">"600"</span>
<span class="tag">&gt;</span>`}},
  ]},

  {part:"Partie 2 — Mettre en forme avec CSS3",lessons:[
    {title:"Intégrer le CSS dans la page HTML",meta:"~2 min",
     intro:"Montrer les 3 méthodes : inline, balise style, fichier externe.",
     script:[
       "Il existe trois façons d'ajouter du CSS à une page HTML. Je vais vous les présenter, mais dès le départ retenez la règle : une seule est vraiment recommandée en production.",
       "Méthode 1 : le CSS inline, directement dans l'attribut <span class='highlight'>style</span> de la balise. Pratique pour tester, mais à éviter absolument dans un vrai projet.",
       "Méthode 2 : la balise <span class='highlight'>&lt;style&gt;</span> dans le head. Mieux, mais le CSS reste mélangé au HTML.",
       "Méthode 3 : le fichier CSS externe, lié avec <span class='highlight'>&lt;link rel=\"stylesheet\"&gt;</span>. C'est la bonne pratique professionnelle. Un fichier HTML propre, un fichier CSS séparé, et on peut réutiliser le même style sur toutes les pages du site."
     ],
     tip:"💡 Ouvrez style.css dans un onglet séparé de l'éditeur pendant que vous modifiez index.html.",
     code:{lang:"html",code:`<span class="cm">&lt;!-- ❌ Méthode 1 : inline (à éviter) --&gt;</span>
<span class="tag">&lt;p</span> <span class="attr">style</span>=<span class="str">"color: red;"</span><span class="tag">&gt;</span>Texte rouge<span class="tag">&lt;/p&gt;</span>

<span class="cm">&lt;!-- ⚠️ Méthode 2 : balise style --&gt;</span>
<span class="tag">&lt;style&gt;</span>
  <span class="sel">p</span> { <span class="prop">color</span>: <span class="val">blue</span>; }
<span class="tag">&lt;/style&gt;</span>

<span class="cm">&lt;!-- ✅ Méthode 3 : fichier externe (recommandée) --&gt;</span>
<span class="tag">&lt;head&gt;</span>
  <span class="tag">&lt;link</span>
    <span class="attr">rel</span>=<span class="str">"stylesheet"</span>
    <span class="attr">href</span>=<span class="str">"style.css"</span>
  <span class="tag">&gt;</span>
<span class="tag">&lt;/head&gt;</span>`}},

    {title:"Couleurs, texte et typographie",meta:"~4 min",
     intro:"Créer style.css et typer les propriétés typographiques en direct.",
     script:[
       "On entre dans le vif du sujet : la typographie. C'est souvent la première chose qu'on veut personnaliser sur une page.",
       "La propriété <span class='highlight'>color</span> change la couleur du texte. On peut utiliser un nom de couleur, un code hexadécimal, ou une valeur RGB.",
       "Pour la police, <span class='highlight'>font-family</span> accepte une liste de polices. On en met plusieurs en cas de secours — si la première n'est pas disponible, le navigateur passe à la suivante.",
       "Google Fonts est votre meilleur ami pour les polices gratuites. Il suffit de coller le lien dans le head, puis d'utiliser le nom de la police en CSS.",
       "Pensez aussi à <span class='highlight'>font-size</span>, <span class='highlight'>font-weight</span> pour le gras, et <span class='highlight'>line-height</span> pour l'interlignage — indispensable pour la lisibilité !"
     ],
     tip:"💡 À montrer : changez la couleur en live avec les DevTools du navigateur (F12).",
     code:{lang:"html",code:`<span class="cm">/* Dans style.css */</span>

<span class="cm">/* Import d'une police Google Fonts */</span>
<span class="kw">@import</span> <span class="val">url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap')</span>;

<span class="sel">body</span> {
  <span class="prop">font-family</span>: <span class="val">'Poppins', sans-serif</span>;
  <span class="prop">font-size</span>: <span class="val">16px</span>;
  <span class="prop">line-height</span>: <span class="val">1.6</span>;
  <span class="prop">color</span>: <span class="val">#333333</span>;
}

<span class="sel">h1</span> {
  <span class="prop">font-size</span>: <span class="val">2.5rem</span>;
  <span class="prop">font-weight</span>: <span class="val">600</span>;
  <span class="prop">color</span>: <span class="val">#7F77DD</span>;
  <span class="prop">text-align</span>: <span class="val">center</span>;
}

<span class="sel">p</span> {
  <span class="prop">color</span>: <span class="val">rgb(80, 80, 80)</span>;
  <span class="prop">margin-bottom</span>: <span class="val">1rem</span>;
}`}},

    {title:"Couleurs, fonds et bordures",meta:"~3 min",
     intro:"Styler une carte avec fond, bordure et ombre.",
     script:[
       "Passons aux couleurs de fond et aux bordures. Ces propriétés transforment complètement l'aspect d'une page.",
       "<span class='highlight'>background-color</span> colore le fond d'un élément. <span class='highlight'>background-image</span> permet d'utiliser une image ou même un dégradé !",
       "La propriété <span class='highlight'>border</span> est un raccourci magique : en une ligne, on définit l'épaisseur, le style et la couleur.",
       "Et <span class='highlight'>border-radius</span>, c'est la propriété qui arrondit les coins. Avec 50%, vous obtenez un cercle parfait !",
       "Enfin, <span class='highlight'>box-shadow</span> pour les ombres. La syntaxe : décalage horizontal, décalage vertical, flou, et couleur."
     ],
     tip:"💡 Astuce : utilisez des couleurs semi-transparentes avec rgba() pour les ombres.",
     code:{lang:"html",code:`<span class="cm">/* Fonds et dégradés */</span>
<span class="sel">.carte</span> {
  <span class="prop">background-color</span>: <span class="val">#ffffff</span>;
  <span class="prop">background-image</span>: <span class="val">linear-gradient(135deg, #667eea, #764ba2)</span>;
  <span class="prop">padding</span>: <span class="val">2rem</span>;
}

<span class="cm">/* Bordures */</span>
<span class="sel">.encadre</span> {
  <span class="prop">border</span>: <span class="val">2px solid #7F77DD</span>;
  <span class="prop">border-radius</span>: <span class="val">12px</span>;
}

<span class="cm">/* Ombre portée */</span>
<span class="sel">.ombre</span> {
  <span class="prop">box-shadow</span>: <span class="val">0 4px 20px rgba(0, 0, 0, 0.15)</span>;
}

<span class="cm">/* Cercle */</span>
<span class="sel">.avatar</span> {
  <span class="prop">width</span>: <span class="val">60px</span>;
  <span class="prop">height</span>: <span class="val">60px</span>;
  <span class="prop">border-radius</span>: <span class="val">50%</span>;
}`}},

    {title:"Pseudo-classes et effets dynamiques",meta:"~3 min",
     intro:"Montrer les effets hover et focus en direct dans le navigateur.",
     script:[

let currentPart = 0, currentLesson = 0;

function renderNav(){
  const tree = document.getElementById('nav-tree');
  tree.innerHTML = '';
  lessons.forEach((part,pi)=>{
    const g = document.createElement('div');
    g.className='part-group';
    g.innerHTML=`<div class="part-title">Partie ${pi+1}</div>`;
    part.lessons.forEach((l,li)=>{
      const b=document.createElement('button');
      b.className='lesson-btn'+(pi===currentPart&&li===currentLesson?' active':'');
      b.textContent=l.title;
      b.onclick=()=>{currentPart=pi;currentLesson=li;renderNav();renderContent()};
      g.appendChild(b);
    });
    tree.appendChild(g);
  });
}

function copyCode(btn, text){
  const clean = text.replace(/<[^>]+>/g,'');
  navigator.clipboard.writeText(clean).then(()=>{
    btn.textContent='✓ Copié !';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copier';btn.classList.remove('copied')},2000);
  });
}

function renderContent(){
  const l=lessons[currentPart].lessons[currentLesson];
  document.getElementById('lesson-title').textContent=l.title;
  document.getElementById('lesson-meta').textContent=`Partie ${currentPart+1} · ${l.meta}`;
  
  const total = lessons.reduce((a,p)=>a+p.lessons.length,0);
  let idx=0;
  for(let i=0;i<currentPart;i++) idx+=lessons[i].lessons.length;
  idx+=currentLesson;

  const prevEnabled = idx>0;
  const nextEnabled = idx<total-1;

  document.getElementById('content').innerHTML=`
    <div class="section-label"><i class="ti ti-message-circle" aria-hidden="true"></i> Script à dire</div>
    <div class="script-box">
      <div class="intro"><i class="ti ti-video" aria-hidden="true"></i> Prép. : ${l.intro}</div>
      ${l.script.map(p=>`<p>${p}</p>`).join('')}
    </div>
    <div class="tip-box">${l.tip}</div>
    <div class="section-label"><i class="ti ti-code" aria-hidden="true"></i> Code à afficher / recopier</div>
    <div class="code-block">
      <div class="code-header">
        <span class="code-lang">${l.code.lang}</span>
        <button class="copy-btn" onclick="copyCode(this,'${encodeURIComponent(l.code.code)}')">Copier</button>
      </div>
      <pre>${l.code.code}</pre>
    </div>
    <div class="nav-btns">
      <button class="nav-btn" ${prevEnabled?'':'disabled'} onclick="navigate(-1)">← Précédent</button>
      <button class="nav-btn" ${nextEnabled?'':'disabled'} onclick="navigate(1)">Suivant →</button>
    </div>
  `;

  document.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.onclick=function(){
      const pre=this.closest('.code-block').querySelector('pre');
      const clean=pre.innerText;
      navigator.clipboard.writeText(clean).then(()=>{
        this.textContent='✓ Copié !';
        this.classList.add('copied');
        setTimeout(()=>{this.textContent='Copier';this.classList.remove('copied')},2000);
      });
    };
  });
}

window.navigate=function(dir){
  const flat=[];
  lessons.forEach((p,pi)=>p.lessons.forEach((_,li)=>flat.push([pi,li])));
  let idx=flat.findIndex(([pi,li])=>pi===currentPart&&li===currentLesson);
  idx+=dir;
  if(idx>=0&&idx<flat.length){[currentPart,currentLesson]=flat[idx];renderNav();renderContent()}
};

renderNav();
renderContent();
</script>
