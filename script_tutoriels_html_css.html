<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Tutoriels HTML / CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    :root {
      --bg: #ffffff;
      --bg2: #f5f5f3;
      --bg3: #eeede9;
      --text: #1a1a1a;
      --text2: #555;
      --text3: #888;
      --border: rgba(0,0,0,0.12);
      --border2: rgba(0,0,0,0.22);
      --purple: #7F77DD;
      --purple-dark: #534AB7;
      --purple-light: #EEEDFE;
      --purple-text: #3C3489;
      --radius: 8px;
      --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg2: #2c2c2e;
        --bg3: #3a3a3c;
        --text: #f2f2f7;
        --text2: #aeaeb2;
        --text3: #636366;
        --border: rgba(255,255,255,0.1);
        --border2: rgba(255,255,255,0.2);
        --purple-light: #26215C;
        --purple-text: #AFA9EC;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }

    /* TOPBAR */
    #topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      padding: .75rem 1rem;
      background: var(--bg);
      border-bottom: 0.5px solid var(--border);
    }
    #menu-btn {
      background: none; border: 0.5px solid var(--border2);
      border-radius: var(--radius); padding: 7px 9px;
      cursor: pointer; color: var(--text2); font-size: 18px; line-height: 1; flex-shrink: 0;
    }
    #menu-btn:active { background: var(--bg2); }
    #topbar-info { flex: 1; min-width: 0; }
    #lesson-title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #lesson-meta { font-size: 11px; color: var(--text3); }
    #counter {
      font-size: 11px; color: var(--text3); flex-shrink: 0;
      background: var(--bg2); padding: 3px 8px;
      border-radius: 20px; border: 0.5px solid var(--border);
    }

    /* DRAWER */
    #drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 20; }
    #drawer-overlay.open { display: block; }
    #drawer {
      position: fixed; top: 0; left: -290px; width: 280px; height: 100%;
      background: var(--bg); border-right: 0.5px solid var(--border);
      overflow-y: auto; z-index: 30; transition: left .22s ease;
    }
    #drawer.open { left: 0; }
    #drawer-head {
      padding: .9rem 1rem; border-bottom: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: var(--bg); z-index: 1;
    }
    #drawer-head span { font-size: 12px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
    #close-drawer { background: none; border: none; font-size: 20px; color: var(--text2); cursor: pointer; padding: 4px; }
    .part-label { padding: .5rem 1rem; font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; background: var(--bg2); }
    .l-btn {
      display: block; width: 100%; text-align: left;
      padding: .6rem 1rem .6rem 1.25rem; font-size: 13px;
      color: var(--text2); background: none; border: none;
      border-left: 2px solid transparent; cursor: pointer; line-height: 1.4;
    }
    .l-btn.active { color: var(--text); font-weight: 500; border-left-color: var(--purple); background: var(--bg2); }
    .l-btn:active { background: var(--bg2); }

    /* CONTENT */
    #content { padding: 1rem; max-width: 700px; margin: 0 auto; }
    .sec-label {
      font-size: 11px; font-weight: 500; letter-spacing: .07em;
      text-transform: uppercase; color: var(--text3);
      margin-bottom: .5rem; display: flex; align-items: center; gap: 5px;
    }
    .prep-box {
      font-size: 13px; color: var(--text2); background: var(--bg2);
      border-radius: var(--radius); padding: .65rem .85rem;
      margin-bottom: .85rem; line-height: 1.55;
      display: flex; gap: 8px; align-items: flex-start;
      border: 0.5px solid var(--border);
    }
    .prep-box i { font-size: 15px; flex-shrink: 0; margin-top: 1px; color: var(--purple); }
    .script-box {
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1rem 1.1rem; margin-bottom: .85rem;
    }
    .script-box p { font-size: 14px; color: var(--text); line-height: 1.78; margin-bottom: .65rem; }
    .script-box p:last-child { margin-bottom: 0; }
    .hl {
      background: var(--purple-light); color: var(--purple-text);
      padding: 1px 5px; border-radius: 3px;
      font-family: 'Courier New', monospace; font-size: 12px;
    }
    .tip-box {
      border-left: 3px solid var(--purple); border-radius: 0 var(--radius) var(--radius) 0;
      background: var(--bg2); padding: .65rem .9rem;
      margin-bottom: .85rem; font-size: 13px; color: var(--text2); line-height: 1.55;
    }
    .code-wrap { border-radius: var(--radius-lg); overflow: hidden; border: 0.5px solid #313145; margin-bottom: .85rem; }
    .code-hdr { display: flex; align-items: center; justify-content: space-between; padding: .5rem .9rem; background: #16162a; }
    .code-lang { font-size: 11px; font-weight: 500; color: var(--purple); letter-spacing: .05em; text-transform: uppercase; }
    .copy-btn {
      font-size: 11px; color: #888; background: none;
      border: 0.5px solid #555; border-radius: 4px;
      padding: 4px 10px; cursor: pointer; font-family: inherit;
      transition: color .15s, border-color .15s;
    }
    .copy-btn:hover { color: #ccc; border-color: #888; }
    .copy-btn.ok { color: #5DCAA5; border-color: #5DCAA5; }
    pre {
      background: #1e1e2e; padding: .9rem 1rem;
      overflow-x: auto; font-size: 13px; line-height: 1.65;
      color: #cdd6f4; font-family: 'Courier New', monospace;
      -webkit-overflow-scrolling: touch;
    }
    .kw { color: #cba6f7; } .tag { color: #89b4fa; } .attr { color: #a6e3a1; }
    .str { color: #f9e2af; } .cm { color: #6c7086; font-style: italic; }
    .sel { color: #89dceb; } .prop { color: #cba6f7; } .val { color: #f9e2af; } .num { color: #fab387; }

    /* NAV BUTTONS */
    .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: .25rem; padding-bottom: 2rem; }
    .nav-btn {
      padding: .7rem; font-size: 13px; background: var(--bg);
      border: 0.5px solid var(--border2); border-radius: var(--radius);
      cursor: pointer; color: var(--text2); font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: background .15s;
    }
    .nav-btn:hover { background: var(--bg2); color: var(--text); }
    .nav-btn:active { background: var(--bg3); }
    .nav-btn:disabled { opacity: .3; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="topbar">
    <button id="menu-btn" aria-label="Menu des leçons"><i class="ti ti-menu-2"></i></button>
    <div id="topbar-info">
      <div id="lesson-title">Sélectionnez une leçon</div>
      <div id="lesson-meta"></div>
    </div>
    <span id="counter"></span>
  </div>

  <div id="drawer-overlay"></div>
  <div id="drawer" role="navigation" aria-label="Leçons">
    <div id="drawer-head">
      <span><i class="ti ti-video"></i> Leçons</span>
      <button id="close-drawer" aria-label="Fermer le menu"><i class="ti ti-x"></i></button>
    </div>
    <div id="nav-tree"></div>
  </div>

  <div id="content"></div>

  <script>
  const L=[
    {part:"Partie 1 — Bases HTML5",lessons:[
      {title:"Première page HTML",meta:"~3 min",
       prep:"Ouvrir VS Code, créer index.html",
       script:["Bienvenue dans ce premier tutoriel ! Aujourd'hui on crée ensemble notre toute première page web en HTML.","HTML, c'est le squelette de chaque page web. Chaque navigateur sait lire ce langage et l'afficher à l'écran.","Tout fichier HTML commence par <span class='hl'>&lt;!DOCTYPE html&gt;</span> — ça indique au navigateur qu'il s'agit d'un document HTML5.","Ensuite la balise racine <span class='hl'>&lt;html&gt;</span>, puis <span class='hl'>&lt;head&gt;</span> pour les métadonnées, et <span class='hl'>&lt;body&gt;</span> pour tout ce qui sera visible. Recopiez le squelette ci-dessous !"],
       tip:"Recopiez ce squelette par cœur — vous l'utiliserez dans chaque projet !",
       code:`<span class="cm">&lt;!-- Squelette HTML5 --&gt;</span>
<span class="kw">&lt;!DOCTYPE html&gt;</span>
<span class="tag">&lt;html</span> <span class="attr">lang</span>=<span class="str">"fr"</span><span class="tag">&gt;</span>
<span class="tag">&lt;head&gt;</span>
  <span class="tag">&lt;meta</span> <span class="attr">charset</span>=<span class="str">"UTF-8"</span><span class="tag">&gt;</span>
  <span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="str">"viewport"</span>
        <span class="attr">content</span>=<span class="str">"width=device-width"</span><span class="tag">&gt;</span>
  <span class="tag">&lt;title&gt;</span>Ma première page<span class="tag">&lt;/title&gt;</span>
<span class="tag">&lt;/head&gt;</span>
<span class="tag">&lt;body&gt;</span>
  <span class="tag">&lt;h1&gt;</span>Bonjour le monde !<span class="tag">&lt;/h1&gt;</span>
  <span class="tag">&lt;p&gt;</span>Ma première page web.<span class="tag">&lt;/p&gt;</span>
<span class="tag">&lt;/body&gt;</span>
<span class="tag">&lt;/html&gt;</span>`},
      {title:"HTML vs CSS",meta:"~2 min",
       prep:"Afficher deux fichiers en split-screen",
       script:["Quelle est la différence entre HTML et CSS ? Une question qu'on me pose tout le temps !","HTML c'est la structure — la charpente d'une maison : les murs, les portes, les fenêtres. On définit CE QU'IL Y A.","CSS c'est la décoration — la peinture, le mobilier, les rideaux. On définit COMMENT ça s'affiche.","Même contenu HTML, apparence totalement différente selon le CSS appliqué. C'est toute la puissance de cette séparation."],
       tip:"Montrez les deux fichiers en split-screen dans votre éditeur.",
       code:`<span class="cm">&lt;!-- HTML : la STRUCTURE --&gt;</span>
<span class="tag">&lt;h1&gt;</span>Mon titre<span class="tag">&lt;/h1&gt;</span>
<span class="tag">&lt;p&gt;</span>Mon paragraphe.<span class="tag">&lt;/p&gt;</span>
<span class="tag">&lt;button&gt;</span>Cliquez ici<span class="tag">&lt;/button&gt;</span>

<span class="cm">/* CSS : la MISE EN FORME */</span>
<span class="sel">h1</span> { <span class="prop">color</span>: <span class="val">#7F77DD</span>; }
<span class="sel">button</span> {
  <span class="prop">background</span>: <span class="val">#7F77DD</span>;
  <span class="prop">color</span>: <span class="val">white</span>;
  <span class="prop">border-radius</span>: <span class="val">6px</span>;
}`},
      {title:"Titres, paragraphes, listes",meta:"~3 min",
       prep:"Ouvrir index.html, taper en direct",
       script:["Pour organiser le texte, HTML offre six niveaux de titres : de h1 à h6. H1 est le plus important.","Règle d'or : une seule balise <span class='hl'>&lt;h1&gt;</span> par page ! C'est crucial pour le SEO et l'accessibilité.","Les paragraphes se balisent avec <span class='hl'>&lt;p&gt;</span>. Chaque paragraphe est automatiquement séparé.","Pour les listes : <span class='hl'>&lt;ul&gt;</span> pour les puces, <span class='hl'>&lt;ol&gt;</span> pour les numéros. Chaque élément = une balise <span class='hl'>&lt;li&gt;</span>."],
       tip:"Tapez ce code avec moi — c'est comme ça qu'on mémorise !",
       code:`<span class="tag">&lt;h1&gt;</span>Titre principal (unique !)<span class="tag">&lt;/h1&gt;</span>
<span class="tag">&lt;h2&gt;</span>Sous-section<span class="tag">&lt;/h2&gt;</span>
<span class="tag">&lt;p&gt;</span>Un paragraphe normal.<span class="tag">&lt;/p&gt;</span>

<span class="cm">&lt;!-- Liste à puces --&gt;</span>
<span class="tag">&lt;ul&gt;</span>
  <span class="tag">&lt;li&gt;</span>Pommes<span class="tag">&lt;/li&gt;</span>
  <span class="tag">&lt;li&gt;</span>Bananes<span class="tag">&lt;/li&gt;</span>
<span class="tag">&lt;/ul&gt;</span>

<span class="cm">&lt;!-- Liste numérotée --&gt;</span>
<span class="tag">&lt;ol&gt;</span>
  <span class="tag">&lt;li&gt;</span>Première étape<span class="tag">&lt;/li&gt;</span>
  <span class="tag">&lt;li&gt;</span>Deuxième étape<span class="tag">&lt;/li&gt;</span>
<span class="tag">&lt;/ol&gt;</span>`},
      {title:"Liens et images",meta:"~3 min",
       prep:"Avoir une image dans le dossier images/",
       script:["Les liens, c'est l'ADN du web ! La balise <span class='hl'>&lt;a&gt;</span> (pour anchor) permet de naviguer d'une page à l'autre.","L'attribut <span class='hl'>href</span> contient la destination. URL complète pour l'externe, nom de fichier pour l'interne.","<span class='hl'>target=\"_blank\"</span> ouvre dans un nouvel onglet. Pratique pour les liens vers des sites externes !","Pour les images : <span class='hl'>&lt;img&gt;</span> est auto-fermant. L'attribut <span class='hl'>alt</span> est obligatoire pour l'accessibilité et le SEO."],
       tip:"Toujours renseigner l'attribut alt sur les images — c'est non-négociable !",
       code:`<span class="cm">&lt;!-- Lien externe --&gt;</span>
<span class="tag">&lt;a</span> <span class="attr">href</span>=<span class="str">"https://google.fr"</span>
   <span class="attr">target</span>=<span class="str">"_blank"</span><span class="tag">&gt;</span>
  Visiter Google
<span class="tag">&lt;/a&gt;</span>

<span class="cm">&lt;!-- Lien interne --&gt;</span>
<span class="tag">&lt;a</span> <span class="attr">href</span>=<span class="str">"contact.html"</span><span class="tag">&gt;</span>
  Nous contacter
<span class="tag">&lt;/a&gt;</span>

<span class="cm">&lt;!-- Image accessible --&gt;</span>
<span class="tag">&lt;img</span>
  <span class="attr">src</span>=<span class="str">"images/photo.jpg"</span>
  <span class="attr">alt</span>=<span class="str">"Paysage de montagne"</span>
  <span class="attr">width</span>=<span class="str">"600"</span>
<span class="tag">&gt;</span>`},
    ]},
    {part:"Partie 2 — CSS3",lessons:[
      {title:"Intégrer le CSS",meta:"~2 min",
       prep:"Créer style.css dans le même dossier",
       script:["Trois façons d'ajouter du CSS. Je vous les présente toutes, mais retenez : une seule est vraiment recommandée.","Méthode 1 : CSS inline dans l'attribut <span class='hl'>style</span>. Pratique pour tester, à éviter en production.","Méthode 2 : la balise <span class='hl'>&lt;style&gt;</span> dans le head. Mieux, mais le CSS reste mélangé au HTML.","Méthode 3 : fichier CSS externe lié avec <span class='hl'>&lt;link rel=\"stylesheet\"&gt;</span>. C'est la bonne pratique pro — un fichier HTML propre, réutilisable sur toutes les pages."],
       tip:"Ouvrez style.css dans un onglet séparé pendant que vous codez index.html.",
       code:`<span class="cm">&lt;!-- ❌ Inline (à éviter) --&gt;</span>
<span class="tag">&lt;p</span> <span class="attr">style</span>=<span class="str">"color:red"</span><span class="tag">&gt;</span>Texte<span class="tag">&lt;/p&gt;</span>

<span class="cm">&lt;!-- ✅ Fichier externe (recommandé) --&gt;</span>
<span class="tag">&lt;head&gt;</span>
  <span class="tag">&lt;link</span>
    <span class="attr">rel</span>=<span class="str">"stylesheet"</span>
    <span class="attr">href</span>=<span class="str">"style.css"</span>
  <span class="tag">&gt;</span>
<span class="tag">&lt;/head&gt;</span>`},
      {title:"Typographie et couleurs",meta:"~4 min",
       prep:"Ouvrir style.css, taper en live",
       script:["La typographie, c'est souvent la première chose qu'on veut personnaliser. Commençons par les fondamentaux.","<span class='hl'>color</span> change la couleur du texte — nom, code hex, ou valeur rgb. <span class='hl'>font-family</span> définit la police.","Google Fonts est votre meilleur ami pour les polices gratuites : copiez le lien dans le head, utilisez le nom en CSS.","Pensez aussi à <span class='hl'>font-size</span>, <span class='hl'>font-weight</span> pour le gras, et surtout <span class='hl'>line-height</span> — indispensable pour la lisibilité !"],
       tip:"Changez les couleurs en live avec les DevTools du navigateur (F12) !",
       code:`<span class="cm">/* Import Google Fonts */</span>
<span class="kw">@import</span> <span class="val">url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap')</span>;

<span class="sel">body</span> {
  <span class="prop">font-family</span>: <span class="val">'Poppins', sans-serif</span>;
  <span class="prop">font-size</span>: <span class="val">16px</span>;
  <span class="prop">line-height</span>: <span class="val">1.6</span>;
  <span class="prop">color</span>: <span class="val">#333</span>;
}

<span class="sel">h1</span> {
  <span class="prop">font-size</span>: <span class="val">2.5rem</span>;
  <span class="prop">font-weight</span>: <span class="val">600</span>;
  <span class="prop">color</span>: <span class="val">#7F77DD</span>;
  <span class="prop">text-align</span>: <span class="val">center</span>;
}`},
      {title:"Fonds, bordures et ombres",meta:"~3 min",
       prep:"Créer une div.carte dans index.html",
       script:["<span class='hl'>background-color</span> colore le fond. <span class='hl'>background-image</span> accepte aussi des dégradés avec linear-gradient !","La propriété <span class='hl'>border</span> en raccourci : épaisseur, style, couleur — tout en une ligne.","<span class='hl'>border-radius</span> arrondit les coins. Avec 50%, vous obtenez un cercle parfait !","<span class='hl'>box-shadow</span> pour les ombres : décalage X, décalage Y, flou, couleur. Utilisez rgba() pour la transparence."],
       tip:"Utilisez des couleurs semi-transparentes avec rgba() pour des ombres douces.",
       code:`<span class="sel">.carte</span> {
  <span class="prop">background-color</span>: <span class="val">#ffffff</span>;
  <span class="prop">padding</span>: <span class="val">2rem</span>;
  <span class="prop">border</span>: <span class="val">2px solid #7F77DD</span>;
  <span class="prop">border-radius</span>: <span class="val">12px</span>;
  <span class="prop">box-shadow</span>: <span class="val">0 4px 20px rgba(0,0,0,0.15)</span>;
}

<span class="sel">.avatar</span> {
  <span class="prop">width</span>: <span class="val">60px</span>;
  <span class="prop">height</span>: <span class="val">60px</span>;
  <span class="prop">border-radius</span>: <span class="val">50%</span>;
}`},
      {title:"Pseudo-classes et transitions",meta:"~3 min",
       prep:"Avoir un bouton .btn dans la page",
       script:["Les pseudo-classes rendent vos pages vivantes ! Elles s'appliquent selon l'état d'un élément.","<span class='hl'>:hover</span> s'active quand la souris passe sur l'élément. Parfait pour les boutons et les liens !","<span class='hl'>:focus</span> s'active quand un champ est sélectionné — indispensable pour l'accessibilité au clavier.","La propriété <span class='hl'>transition</span> anime automatiquement les changements d'état. Sans elle, tout change brutalement. Avec, c'est fluide et professionnel."],
       tip:"Dans les DevTools : clic droit > Inspecter > cocher :hover pour simuler l'état.",
       code:`<span class="sel">.btn</span> {
  <span class="prop">background</span>: <span class="val">#7F77DD</span>;
  <span class="prop">color</span>: <span class="val">white</span>;
  <span class="prop">padding</span>: <span class="val">10px 24px</span>;
  <span class="prop">border-radius</span>: <span class="val">8px</span>;
  <span class="prop">border</span>: <span class="val">none</span>;
  <span class="prop">cursor</span>: <span class="val">pointer</span>;
  <span class="prop">transition</span>: <span class="val">all 0.2s ease</span>;
}
<span class="sel">.btn:hover</span> {
  <span class="prop">background</span>: <span class="val">#534AB7</span>;
  <span class="prop">transform</span>: <span class="val">translateY(-2px)</span>;
}
<span class="sel">input:focus</span> {
  <span class="prop">outline</span>: <span class="val">2px solid #7F77DD</span>;
}`},
    ]},
    {part:"Partie 3 — Mise en page",lessons:[
      {title:"Le box model",meta:"~4 min",
       prep:"Ouvrir les DevTools, onglet Computed",
       script:["Le box model, c'est LE concept le plus important en CSS. Comprenez ça, vous comprenez tout.","Chaque élément HTML est une boîte à quatre couches : contenu, padding, bordure, marge.","<span class='hl'>padding</span> = espace intérieur entre le contenu et la bordure. <span class='hl'>margin</span> = espace extérieur entre la bordure et les voisins.","Appliquez toujours <span class='hl'>box-sizing: border-box</span> — la largeur inclut alors padding et bordure. Beaucoup plus intuitif !"],
       tip:"Montrez l'onglet Computed dans les DevTools — il affiche le schéma box model interactif.",
       code:`<span class="cm">/* Reset global — toujours mettre ! */</span>
<span class="sel">*</span> {
  <span class="prop">box-sizing</span>: <span class="val">border-box</span>;
  <span class="prop">margin</span>: <span class="val">0</span>;
  <span class="prop">padding</span>: <span class="val">0</span>;
}
<span class="sel">.carte</span> {
  <span class="prop">width</span>: <span class="val">300px</span>;
  <span class="prop">padding</span>: <span class="val">16px 24px</span>;
  <span class="prop">margin</span>: <span class="val">0 auto</span>; <span class="cm">/* centrage !</span>
  <span class="prop">border</span>: <span class="val">1px solid #ccc</span>;
  <span class="prop">border-radius</span>: <span class="val">12px</span>;
}`},
      {title:"Flexbox",meta:"~5 min",
       prep:"Créer une nav et une .grille dans HTML",
       script:["Flexbox, c'est la révolution de la mise en page CSS. Centrer un élément verticalement ? Trois lignes suffisent.","On active Flexbox sur le conteneur parent avec <span class='hl'>display: flex</span>. Les enfants deviennent automatiquement des flex items.","<span class='hl'>justify-content</span> contrôle l'axe principal (horizontal). <span class='hl'>align-items</span> contrôle l'axe secondaire (vertical).","Pour centrer parfaitement : <span class='hl'>justify-content: center</span> + <span class='hl'>align-items: center</span>. Magique !"],
       tip:"Entraînez-vous sur flexboxfroggy.com — c'est un jeu pour apprendre Flexbox !",
       code:`<span class="cm">/* Centrage parfait */</span>
<span class="sel">.hero</span> {
  <span class="prop">display</span>: <span class="val">flex</span>;
  <span class="prop">justify-content</span>: <span class="val">center</span>;
  <span class="prop">align-items</span>: <span class="val">center</span>;
  <span class="prop">height</span>: <span class="val">100vh</span>;
}
<span class="cm">/* Barre de navigation */</span>
<span class="sel">nav</span> {
  <span class="prop">display</span>: <span class="val">flex</span>;
  <span class="prop">justify-content</span>: <span class="val">space-between</span>;
  <span class="prop">align-items</span>: <span class="val">center</span>;
  <span class="prop">padding</span>: <span class="val">1rem 2rem</span>;
}
<span class="cm">/* Grille de cartes */</span>
<span class="sel">.grille</span> {
  <span class="prop">display</span>: <span class="val">flex</span>;
  <span class="prop">flex-wrap</span>: <span class="val">wrap</span>;
  <span class="prop">gap</span>: <span class="val">1.5rem</span>;
}
<span class="sel">.grille .carte</span> {
  <span class="prop">flex</span>: <span class="val">1 1 280px</span>;
}`},
      {title:"CSS Grid",meta:"~4 min",
       prep:"Créer header / sidebar / main / footer",
       script:["CSS Grid excelle pour les mises en page en deux dimensions — lignes ET colonnes simultanément.","On active Grid avec <span class='hl'>display: grid</span>. <span class='hl'>grid-template-columns</span> définit les colonnes.","<span class='hl'>1fr</span> signifie une fraction de l'espace disponible. <span class='hl'>repeat(3, 1fr)</span> = trois colonnes égales.","La propriété <span class='hl'>gap</span> crée de l'espace entre toutes les cellules. Et <span class='hl'>grid-column: 1 / -1</span> étend un élément sur toute la largeur."],
       tip:"Firefox DevTools a le meilleur inspecteur Grid. Entraînez-vous sur cssgridgarden.com !",
       code:`<span class="sel">.page</span> {
  <span class="prop">display</span>: <span class="val">grid</span>;
  <span class="prop">grid-template-columns</span>: <span class="val">250px 1fr</span>;
  <span class="prop">min-height</span>: <span class="val">100vh</span>;
}
<span class="sel">header</span>, <span class="sel">footer</span> {
  <span class="prop">grid-column</span>: <span class="val">1 / -1</span>;
}
<span class="cm">/* Grille responsive auto */</span>
<span class="sel">.articles</span> {
  <span class="prop">display</span>: <span class="val">grid</span>;
  <span class="prop">grid-template-columns</span>:
    <span class="val">repeat(auto-fit, minmax(280px, 1fr))</span>;
  <span class="prop">gap</span>: <span class="val">1.5rem</span>;
}`},
    ]},
    {part:"Partie 4 — Avancé",lessons:[
      {title:"Formulaires HTML",meta:"~5 min",
       prep:"Créer contact.html",
       script:["Les formulaires permettent à vos visiteurs de vous écrire : inscription, contact, commande...","La balise <span class='hl'>&lt;form&gt;</span> enveloppe tout. <span class='hl'>action</span> = où envoyer les données. <span class='hl'>method</span> = GET ou POST.","Chaque champ est un <span class='hl'>&lt;input&gt;</span> avec un attribut <span class='hl'>type</span> : text, email, password, checkbox, file...","Associez toujours un <span class='hl'>&lt;label&gt;</span> à chaque champ via <span class='hl'>for</span> + <span class='hl'>id</span>. C'est essentiel pour l'accessibilité !"],
       tip:"HTML5 valide automatiquement les champs avec type='email', required, minlength, etc.",
       code:`<span class="tag">&lt;form</span> <span class="attr">action</span>=<span class="str">"/contact"</span>
      <span class="attr">method</span>=<span class="str">"POST"</span><span class="tag">&gt;</span>

  <span class="tag">&lt;label</span> <span class="attr">for</span>=<span class="str">"nom"</span><span class="tag">&gt;</span>Votre nom<span class="tag">&lt;/label&gt;</span>
  <span class="tag">&lt;input</span> <span class="attr">type</span>=<span class="str">"text"</span>
         <span class="attr">id</span>=<span class="str">"nom"</span> <span class="attr">required</span><span class="tag">&gt;</span>

  <span class="tag">&lt;label</span> <span class="attr">for</span>=<span class="str">"email"</span><span class="tag">&gt;</span>Email<span class="tag">&lt;/label&gt;</span>
  <span class="tag">&lt;input</span> <span class="attr">type</span>=<span class="str">"email"</span>
         <span class="attr">id</span>=<span class="str">"email"</span> <span class="attr">required</span><span class="tag">&gt;</span>

  <span class="tag">&lt;label</span> <span class="attr">for</span>=<span class="str">"msg"</span><span class="tag">&gt;</span>Message<span class="tag">&lt;/label&gt;</span>
  <span class="tag">&lt;textarea</span> <span class="attr">id</span>=<span class="str">"msg"</span>
             <span class="attr">rows</span>=<span class="str">"5"</span> <span class="attr">required</span><span class="tag">&gt;&lt;/textarea&gt;</span>

  <span class="tag">&lt;button</span> <span class="attr">type</span>=<span class="str">"submit"</span><span class="tag">&gt;</span>Envoyer<span class="tag">&lt;/button&gt;</span>
<span class="tag">&lt;/form&gt;</span>`},
      {title:"Responsive et Media Queries",meta:"~4 min",
       prep:"DevTools en mode mobile (Ctrl+Shift+M)",
       script:["60% des visites web se font sur mobile. Nos pages doivent s'adapter à toutes les tailles d'écran.","Les Media Queries CSS s'écrivent avec <span class='hl'>@media</span> suivi d'une condition sur la largeur. On réécrit les règles qui changent.","L'approche recommandée : Mobile First. On code d'abord pour les petits écrans, puis on agrandit progressivement.","Points de rupture classiques : 768px tablette, 1024px desktop. Adaptez-les à votre contenu, pas à des appareils !"],
       tip:"Simulez différents écrans avec le mode responsive des DevTools (Ctrl+Shift+M).",
       code:`<span class="cm">/* Mobile first : style de base */</span>
<span class="sel">.grille</span> {
  <span class="prop">display</span>: <span class="val">grid</span>;
  <span class="prop">grid-template-columns</span>: <span class="val">1fr</span>;
  <span class="prop">gap</span>: <span class="val">1rem</span>;
}
<span class="cm">/* Tablette (≥ 768px) */</span>
<span class="kw">@media</span> (min-width: <span class="num">768px</span>) {
  <span class="sel">.grille</span> {
    <span class="prop">grid-template-columns</span>: <span class="val">repeat(2, 1fr)</span>;
  }
}
<span class="cm">/* Desktop (≥ 1024px) */</span>
<span class="kw">@media</span> (min-width: <span class="num">1024px</span>) {
  <span class="sel">.grille</span> {
    <span class="prop">grid-template-columns</span>: <span class="val">repeat(3, 1fr)</span>;
  }
}`},
    ]},
  ];

  let cp=0,cl=0;
  function flat(){const a=[];L.forEach((p,pi)=>p.lessons.forEach((_,li)=>a.push([pi,li])));return a}

  function renderNav(){
    const t=document.getElementById('nav-tree');
    t.innerHTML='';
    L.forEach((p,pi)=>{
      const g=document.createElement('div');
      g.innerHTML=`<div class="part-label">Partie ${pi+1}</div>`;
      p.lessons.forEach((l,li)=>{
        const b=document.createElement('button');
        b.className='l-btn'+(pi===cp&&li===cl?' active':'');
        b.textContent=l.title;
        b.onclick=()=>{cp=pi;cl=li;closeDrawer();renderNav();renderContent();window.scrollTo(0,0)};
        g.appendChild(b);
      });
      t.appendChild(g);
    });
  }

  function renderContent(){
    const l=L[cp].lessons[cl];
    const f=flat();
    const idx=f.findIndex(([pi,li])=>pi===cp&&li===cl);
    document.getElementById('lesson-title').textContent=l.title;
    document.getElementById('lesson-meta').textContent=`Partie ${cp+1} · ${l.meta}`;
    document.getElementById('counter').textContent=`${idx+1}/${f.length}`;
    document.title=`${l.title} — Script HTML/CSS`;
    document.getElementById('content').innerHTML=`
      <div class="sec-label" style="margin-top:1rem"><i class="ti ti-player-record"></i> Préparation</div>
      <div class="prep-box"><i class="ti ti-player-record"></i>${l.prep}</div>
      <div class="sec-label"><i class="ti ti-message-circle"></i> Script</div>
      <div class="script-box">${l.script.map(p=>`<p>${p}</p>`).join('')}</div>
      <div class="tip-box"><i class="ti ti-bulb" style="color:#7F77DD;margin-right:4px"></i>${l.tip}</div>
      <div class="sec-label"><i class="ti ti-code"></i> Code à recopier</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">HTML / CSS</span>
          <button class="copy-btn">Copier</button>
        </div>
        <pre>${l.code}</pre>
      </div>
      <div class="nav-row">
        <button class="nav-btn" ${idx>0?'':'disabled'} onclick="nav(-1)"><i class="ti ti-arrow-left"></i> Précédent</button>
        <button class="nav-btn" ${idx<f.length-1?'':'disabled'} onclick="nav(1)">Suivant <i class="ti ti-arrow-right"></i></button>
      </div>
    `;
    document.querySelector('.copy-btn').onclick=function(){
      const txt=document.querySelector('pre').innerText;
      navigator.clipboard.writeText(txt).then(()=>{
        this.textContent='✓ Copié !';this.classList.add('ok');
        setTimeout(()=>{this.textContent='Copier';this.classList.remove('ok')},2000);
      });
    };
  }

  window.nav=function(d){
    const f=flat();
    let i=f.findIndex(([pi,li])=>pi===cp&&li===cl)+d;
    if(i>=0&&i<f.length){[cp,cl]=f[i];renderNav();renderContent();window.scrollTo(0,0)}
  };

  function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drawer-overlay').classList.add('open')}
  function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawer-overlay').classList.remove('open')}
  document.getElementById('menu-btn').onclick=openDrawer;
  document.getElementById('close-drawer').onclick=closeDrawer;
  document.getElementById('drawer-overlay').onclick=closeDrawer;

  renderNav();
  renderContent();
  </script>
</body>
</html>
